    }
    .note a { color: var(--accent); font-weight: 700; text-underline-offset: .2em; }
    .preview { display: grid; gap: 1rem; padding-bottom: 1.75rem; }
    .preview img {

      width: 100%;
      height: auto;
      background: var(--background);
      border: 1px solid var(--border);
